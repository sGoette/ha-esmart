# Creates a GitHub release (and tag v<version>) whenever the version in manifest.json
# changes on main. HACS offers these releases as updates in Home Assistant.
name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/esmart/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version custom_components/esmart/manifest.json)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already released, nothing to do"
            exit 0
          fi
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$range"
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
